<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1920, initial-scale=1.0"/>
  <title>Overlay Tablet</title>
  <style>
    :root {
      --amber: #d4a843;
      --smoke: #f0ebe3;
      --smoke3: rgba(240,235,227,.35);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      width: 100vw; height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
    }
    * { -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }

    /* ── TICKER BAR ── */
    .ticker-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: rgba(4,4,4,0.2);
      border-bottom: 2px solid rgba(212,168,67,.8);
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    .ticker-pill {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 0 20px 0 16px;
      height: 100%;
      background: rgba(212,168,67,.2);
      border-right: 1.5px solid rgba(212,168,67,.5);
      font-size: .7rem; letter-spacing: .2em; text-transform: uppercase;
      color: var(--amber); font-weight: 800; text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      white-space: nowrap;
    }
    .ticker-pill .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 6px var(--amber);
      animation: blink 2s infinite;
      flex-shrink: 0;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    .ticker-scroll {
      flex: 1; overflow: hidden;
      height: 100%;
      display: flex; align-items: center;
    }
    .ticker-track {
      display: flex; align-items: center;
      white-space: nowrap;
      animation: scroll 30s linear infinite;
    }
    @keyframes scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .ticker-item {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 0 40px;
      font-size: .88rem;
      color: rgba(255,255,255,1); font-weight: 700; text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      letter-spacing: .02em;
      font-weight: 500;
    }
    .ticker-item .site {
      font-style: italic;
      color: var(--amber); font-size: .95rem; font-weight: 800; text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      font-weight: 700;
    }
    .ticker-item .price {
      color: #fff; font-weight: 800; text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
    }
    .ticker-sep { color: rgba(212,168,67,.5); }

    /* ── POPUP — bottom left ── */
    #popup-wrap {
      position: fixed;
      bottom: 20px; left: 20px;
      display: flex; flex-direction: column; gap: 8px;
      z-index: 100;
    }
    .popup { animation: popIn .45s cubic-bezier(.175,.885,.32,1.275) both; }
    @keyframes popIn {
      from { opacity:0; transform: translateX(-16px) scale(.95); }
      to   { opacity:1; transform: translateX(0) scale(1); }
    }
    .popup.hide { animation: popOut .35s ease forwards; }
    @keyframes popOut {
      from { opacity:1; transform: translateX(0); }
      to   { opacity:0; transform: translateX(-12px); }
    }

    .receipt-box {
      background: rgba(8,6,4,.98);
      border: 2px solid var(--amber);
      padding: 10px 12px;
      width: 155px;
      box-shadow: 0 6px 24px rgba(0,0,0,.85);
    }
    .receipt-site  { font-size:.42rem; letter-spacing:.1em; color:var(--smoke3); margin-bottom:3px; text-align:center; text-transform:uppercase; }
    .receipt-icon  { font-size:.95rem; margin-bottom:3px; text-align:center; }
    .receipt-confirmed { font-size:.35rem; letter-spacing:.18em; color:var(--amber); text-transform:uppercase; margin-bottom:7px; text-align:center; font-weight:700; }
    .receipt-line  { border:none; border-top:1px solid rgba(212,168,67,.2); margin:5px 0; }
    .receipt-row   { display:flex; justify-content:space-between; padding:2px 0; font-size:.52rem; }
    .receipt-label { color:var(--smoke3); }
    .receipt-value { color:var(--smoke); font-weight:600; max-width:90px; text-align:right; word-break:break-word; }
    .receipt-total-row { display:flex; justify-content:space-between; padding:4px 0; border-top:1px solid rgba(212,168,67,.25); margin-top:2px; }
    .receipt-total-label { color:var(--smoke); font-weight:700; font-size:.55rem; }
    .receipt-total-val   { color:var(--amber); font-weight:700; font-size:.62rem; }

    /* ── MESSAGE NOTIFICATION — top right ── */
    #recent-wrap {
      position: fixed;
      top: 80px; right: 20px;
      width: 320px;
      display: flex; flex-direction: column; gap: 7px;
    }
    .recent-item {
      display:flex; align-items:center; gap:8px;
      padding:14px 16px;
      background:rgba(6,6,6,.94);
      border:1px solid rgba(212,168,67,.3);
      border-left: 3px solid var(--amber);
      animation: slideInRight .4s cubic-bezier(.175,.885,.32,1.275) both;
    }
    .recent-item.hide {
      animation: slideOutRight .35s ease forwards;
    }
    @keyframes slideInRight {
      from { opacity:0; transform: translateX(16px); }
      to   { opacity:1; transform: translateX(0); }
    }
    @keyframes slideOutRight {
      from { opacity:1; transform: translateX(0); }
      to   { opacity:0; transform: translateX(16px); }
    }
    .recent-icon { font-size:1.4rem; flex-shrink:0; }
    .recent-body { flex:1; min-width:0; }
    .recent-name { font-size:.92rem; color:rgba(240,235,227,.92); line-height:1.5; font-weight:500; }
    .recent-name strong { color:var(--amber); font-weight:700; }
    .recent-amt { font-size:.95rem; color:var(--amber); font-weight:700; margin-top:4px; }
  </style>
</head>
<body>

<div id="popup-wrap"></div>
<div id="recent-wrap"></div>

<div class="ticker-bar">
  <div class="ticker-pill">
    <div class="dot"></div>
    Online Drinks
  </div>
  <div class="ticker-scroll">
    <div class="ticker-track" id="ticker-track"></div>
  </div>
</div>

<script>
  var DEFAULT_MSG = '🌸 Support the Ladies <span class="ticker-sep">·</span> <span class="site">pattayasoipearl.com</span> <span class="ticker-sep">·</span> 🍹 <span class="price">฿210</span> per drink 🌸';

  function getMsg() {
    var params = new URLSearchParams(window.location.search);
    var custom = params.get('msg');
    if (custom) return '🌸 ' + custom + ' <span class="ticker-sep">·</span> <span class="site">pattayasoipearl.com</span> <span class="ticker-sep">·</span> <span class="price">฿210</span> per drink 🌸';
    return DEFAULT_MSG;
  }

  var track = document.getElementById('ticker-track');
  var html = '';
  for (var i = 0; i < 6; i++) {
    html += '<span class="ticker-item">' + getMsg() + '</span>';
  }
  track.innerHTML = html;

  var lastSeenId = null;
  var POPUP_DURATION = 30 * 1000;
  var MSG_DURATION = 90 * 1000; // 1분30초

  function showPopup(data) {
    var staffDisplay = (data.staff_name || '—') + (data.staff_no ? ' #' + data.staff_no : '');
    var popup = document.createElement('div');
    popup.className = 'popup';
    popup.innerHTML =
      '<div class="receipt-box">' +
        '<p class="receipt-site">pattayasoipearl.com</p>' +
        '<div class="receipt-icon">🌸</div>' +
        '<p class="receipt-confirmed">✦ Drink Confirmed ✦</p>' +
        '<hr class="receipt-line">' +
        '<div class="receipt-row"><span class="receipt-label">Bar</span><span class="receipt-value">' + (data.bar||'—') + '</span></div>' +
        '<div class="receipt-row"><span class="receipt-label">Staff</span><span class="receipt-value">' + staffDisplay + '</span></div>' +
        '<div class="receipt-row"><span class="receipt-label">From</span><span class="receipt-value">' + (data.from||'Anonymous') + '</span></div>' +
        (data.message ? '<div class="receipt-row"><span class="receipt-label">Msg</span><span class="receipt-value">"' + data.message + '"</span></div>' : '') +
        '<hr class="receipt-line">' +
        '<div class="receipt-total-row"><span class="receipt-total-label">Drink Amount</span><span class="receipt-total-val">฿' + (data.tip_amount||0).toLocaleString() + '</span></div>' +
      '</div>';
    document.getElementById('popup-wrap').appendChild(popup);
    setTimeout(function() {
      popup.classList.add('hide');
      setTimeout(function() { popup.remove(); }, 400);
    }, POPUP_DURATION);
  }

  function addRecent(data) {
    var staff = (data.staff_name||'Staff') + (data.staff_no ? ' #'+data.staff_no : '');
    var wrap = document.getElementById('recent-wrap');
    var item = document.createElement('div');
    item.className = 'recent-item';
    item.innerHTML =
      '<div class="recent-icon">🍹</div>' +
      '<div class="recent-body">' +
        '<div class="recent-name"><strong>' + (data.from||'Anonymous') + '</strong> sent a drink to <strong>' + staff + '</strong></div>' +
        '<div class="recent-amt">฿' + (data.tip_amount||0).toLocaleString() + ' · ' + (data.bar||'') + '</div>' +
      '</div>';
    wrap.appendChild(item);
    setTimeout(function() {
      item.classList.add('hide');
      setTimeout(function() { item.remove(); }, 400);
    }, MSG_DURATION);
  }

  var initialized = false;

  function poll() {
    fetch('/.netlify/functions/webhook')
      .then(function(r){ return r.json(); })
      .then(function(data) {
        var orders = data.orders || [];
        // 처음 켤 때는 기존 주문 무시하고 최신 ID만 저장
        if (!initialized) {
          initialized = true;
          if (orders.length > 0) lastSeenId = orders[0].id;
          return;
        }
        if (orders.length === 0) return;
        var newest = orders[0];
        if (newest.id !== lastSeenId) {
          var newOnes = [];
          for (var i = 0; i < orders.length; i++) {
            if (orders[i].id === lastSeenId) break;
            newOnes.push(orders[i]);
          }
          newOnes.reverse().forEach(function(o) {
            showPopup(o); addRecent(o);
          });
          lastSeenId = newest.id;
        }
      })
      .catch(function(){});
  }

  if (window.location.search.includes('test=')) {
    var testCount = parseInt(new URLSearchParams(window.location.search).get('test')) || 1;
    var fakeOrders = [
      { from:'Julien', staff_name:'Fah',  staff_no:'60', bar:'Nikki Bar',    tip_amount:2100, message:'You are amazing!' },
      { from:'John',   staff_name:'Jai',  staff_no:'12', bar:'Pearl Bar',    tip_amount:630  },
      { from:'Mike',   staff_name:'Su',   staff_no:'7',  bar:'Lollipop Bar', tip_amount:1050 },
      { from:'David',  staff_name:'Nook', staff_no:'33', bar:'Nikki Bar',    tip_amount:420  },
      { from:'Chris',  staff_name:'Bow',  staff_no:'5',  bar:'Play Girls',   tip_amount:840  },
    ];
    for (var i = 0; i < Math.min(testCount, fakeOrders.length); i++) {
      (function(order, delay) {
        setTimeout(function() { showPopup(order); addRecent(order); }, 800 + delay * 600);
      })(fakeOrders[i], i);
    }
  }

  poll();
  setInterval(poll, 5000);
</script>
</body>
</html>
