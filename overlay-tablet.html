<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1920, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Overlay Tablet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --amber: #d4a843;
      --smoke: #f0ebe3;
      --smoke3: rgba(240,235,227,.3);
      --serif: 'Playfair Display', Georgia, serif;
      --body: 'DM Sans', system-ui, sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: transparent;
      font-family: var(--body);
      width: 100vw; height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
      image-rendering: -webkit-optimize-contrast;
    }

    /* 모든 텍스트 선명도 강화 */
    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
    }

    /* ── TICKER BAR ── */
    .ticker-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 72px;
      background: rgba(4,4,4,1);
      border-top: 3px solid rgba(212,168,67,.9);
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    .ticker-pill {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 10px;
      padding: 0 24px 0 20px;
      height: 100%;
      background: rgba(212,168,67,.18);
      border-right: 1.5px solid rgba(212,168,67,.4);
      font-size: .78rem; letter-spacing: .24em; text-transform: uppercase;
      color: var(--amber); font-weight: 600;
      white-space: nowrap;
    }
    .ticker-pill .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 8px var(--amber);
      animation: blink 2s infinite;
      flex-shrink: 0;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    .ticker-scroll {
      flex: 1; overflow: hidden;
      height: 100%;
      display: flex; align-items: center;
    }
    .ticker-track {
      display: flex; align-items: center;
      white-space: nowrap;
      animation: scroll 22s linear infinite;
    }
    @keyframes scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .ticker-item {
      display: inline-flex; align-items: center; gap: 12px;
      padding: 0 50px;
      font-size: 1.05rem;
      color: rgba(240,235,227,.92);
      letter-spacing: .02em;
      font-weight: 500;
    }
    .ticker-item .site {
      font-family: var(--serif); font-style: italic;
      color: var(--amber); font-size: 1.15rem;
      font-weight: 700;
    }
    .ticker-item .price {
      color: #fff; font-weight: 600; font-size: 1.05rem;
    }
    .ticker-sep { color: rgba(212,168,67,.4); }

    /* ── POPUP — bottom left ── */
    #popup-wrap {
      position: fixed;
      bottom: 85px; left: 24px;
      display: flex; flex-direction: column; gap: 10px;
      z-index: 100;
    }
    .popup { animation: popIn .5s cubic-bezier(.175,.885,.32,1.275) both; }
    @keyframes popIn {
      from { opacity:0; transform: translateX(-18px) scale(.94); }
      to   { opacity:1; transform: translateX(0) scale(1); }
    }
    .popup.hide { animation: popOut .4s ease forwards; }
    @keyframes popOut {
      from { opacity:1; transform: translateX(0); }
      to   { opacity:0; transform: translateX(-12px); }
    }

    .receipt-box {
      background: rgba(8,6,4,.99);
      border: 2px solid var(--amber);
      padding: 12px 14px;
      width: 170px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 28px rgba(0,0,0,.8);
    }
    .receipt-site  { font-size:.48rem; letter-spacing:.12em; color:var(--smoke3); margin-bottom:3px; text-align:center; }
    .receipt-icon  { font-size:1.1rem; margin-bottom:3px; text-align:center; }
    .receipt-confirmed { font-size:.38rem; letter-spacing:.2em; color:var(--amber); text-transform:uppercase; margin-bottom:8px; text-align:center; font-weight:600; }
    .receipt-line  { border:none; border-top:1px solid rgba(212,168,67,.15); margin:6px 0; }
    .receipt-row   { display:flex; justify-content:space-between; padding:2px 0; font-size:.58rem; }
    .receipt-label { color:var(--smoke3); }
    .receipt-value { color:var(--smoke); font-weight:500; max-width:100px; text-align:right; word-break:break-word; }
    .receipt-total-row { display:flex; justify-content:space-between; padding:4px 0; border-top:1px solid rgba(212,168,67,.22); margin-top:2px; }
    .receipt-total-label { color:var(--smoke); font-weight:600; font-size:.6rem; }
    .receipt-total-val   { color:var(--amber); font-weight:700; font-size:.68rem; }

    /* ── RECENT — top right ── */
    #recent-wrap {
      position: fixed;
      top: 28px; right: 28px;
      width: 240px;
      display: flex; flex-direction: column; gap: 5px;
    }
    .recent-label {
      font-size:.58rem; letter-spacing:.2em; text-transform:uppercase;
      color:rgba(212,168,67,.55); margin-bottom:4px; text-align:right;
      font-weight: 500;
    }
    .recent-item {
      display:flex; align-items:center; justify-content:space-between;
      padding:7px 11px;
      background:rgba(8,8,8,.88);
      border:1px solid rgba(212,168,67,.18);
      backdrop-filter:blur(10px);
      animation: fadeIn .35s ease both;
    }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .recent-name { font-size:.72rem; color:rgba(240,235,227,.72); }
    .recent-name span { color:var(--amber); font-weight:500; }
    .recent-amt { font-size:.72rem; color:rgba(212,168,67,.85); font-weight:600; }
  </style>
</head>
<body>

<div id="popup-wrap"></div>

<div id="recent-wrap">
  <div class="recent-label" id="recent-label" style="display:none">Recent</div>
</div>

<div class="ticker-bar">
  <div class="ticker-pill">
    <div class="dot"></div>
    Online Drinks
  </div>
  <div class="ticker-scroll">
    <div class="ticker-track" id="ticker-track"></div>
  </div>
</div>

<script>
  var DEFAULT_MSG = '🌸 Support the Ladies <span class="ticker-sep">·</span> <span class="site">pattayasoipearl.com</span> <span class="ticker-sep">·</span> 🍹 <span class="price">฿210</span> per drink 🌸';

  function getMsg() {
    var params = new URLSearchParams(window.location.search);
    var custom = params.get('msg');
    if (custom) return '🌸 ' + custom + ' <span class="ticker-sep">·</span> <span class="site">pattayasoipearl.com</span> <span class="ticker-sep">·</span> <span class="price">฿210</span> per drink 🌸';
    return DEFAULT_MSG;
  }

  var track = document.getElementById('ticker-track');
  var msg = getMsg();
  var html = '';
  for (var i = 0; i < 6; i++) {
    html += '<span class="ticker-item">' + msg + '</span>';
  }
  track.innerHTML = html;

  var recentOrders = [];
  var lastSeenId = null;
  var evtSource = null;
  var POPUP_DURATION = 30 * 1000;

  function showPopup(data) {
    var staffDisplay = (data.staff_name || '—') + (data.staff_no ? ' #' + data.staff_no : '');
    var popup = document.createElement('div');
    popup.className = 'popup';
    popup.innerHTML =
      '<div class="receipt-box">' +
        '<p class="receipt-site">pattayasoipearl.com</p>' +
        '<div class="receipt-icon">🌸</div>' +
        '<p class="receipt-confirmed">✦ Drink Confirmed ✦</p>' +
        '<hr class="receipt-line">' +
        '<div class="receipt-row"><span class="receipt-label">Bar</span><span class="receipt-value">' + (data.bar||'—') + '</span></div>' +
        '<div class="receipt-row"><span class="receipt-label">Staff</span><span class="receipt-value">' + staffDisplay + '</span></div>' +
        '<div class="receipt-row"><span class="receipt-label">From</span><span class="receipt-value">' + (data.from||'Anonymous') + '</span></div>' +
        (data.message ? '<div class="receipt-row"><span class="receipt-label">Message</span><span class="receipt-value">"' + data.message + '"</span></div>' : '') +
        '<hr class="receipt-line">' +
        '<div class="receipt-total-row"><span class="receipt-total-label">Drink Amount</span><span class="receipt-total-val">฿' + (data.tip_amount||0).toLocaleString() + '</span></div>' +
      '</div>';
    document.getElementById('popup-wrap').appendChild(popup);
    setTimeout(function() {
      popup.classList.add('hide');
      setTimeout(function() { popup.remove(); }, 500);
    }, POPUP_DURATION);
  }

  function addRecent(data) {
    recentOrders.unshift(data);
    if (recentOrders.length > 5) recentOrders.pop();
    document.getElementById('recent-label').style.display = 'block';
    var wrap = document.getElementById('recent-wrap');
    wrap.querySelectorAll('.recent-item').forEach(function(i){ i.remove(); });
    recentOrders.forEach(function(o) {
      var staff = (o.staff_name||'Staff') + (o.staff_no ? ' #'+o.staff_no : '');
      var item = document.createElement('div');
      item.className = 'recent-item';
      item.innerHTML =
        '<span class="recent-name"><span>' + (o.from||'Anon') + '</span> → ' + staff + '</span>' +
        '<span class="recent-amt">฿' + (o.tip_amount||0).toLocaleString() + '</span>';
      wrap.appendChild(item);
    });
  }

  function poll() {
    fetch('/.netlify/functions/webhook')
      .then(function(r){ return r.json(); })
      .then(function(data) {
        var orders = data.orders || [];
        if (orders.length === 0) return;
        var newest = orders[0];
        if (newest.id !== lastSeenId) {
          var newOnes = [];
          for (var i = 0; i < orders.length; i++) {
            if (orders[i].id === lastSeenId) break;
            newOnes.push(orders[i]);
          }
          newOnes.reverse().forEach(function(o) {
            showPopup(o); addRecent(o);
          });
          lastSeenId = newest.id;
        }
      })
      .catch(function(){});
  }

  if (window.location.search.includes('test=')) {
    var testCount = parseInt(new URLSearchParams(window.location.search).get('test')) || 1;
    var fakeOrders = [
      { from:'Julien', staff_name:'Fah',  staff_no:'60', bar:'Nikki Bar',    tip_amount:2100, message:'You are amazing!' },
      { from:'John',   staff_name:'Jai',  staff_no:'12', bar:'Pearl Bar',    tip_amount:630  },
      { from:'Mike',   staff_name:'Su',   staff_no:'7',  bar:'Lollipop Bar', tip_amount:1050 },
      { from:'David',  staff_name:'Nook', staff_no:'33', bar:'Nikki Bar',    tip_amount:420  },
      { from:'Chris',  staff_name:'Bow',  staff_no:'5',  bar:'Play Girls',   tip_amount:840  },
    ];
    for (var i = 0; i < Math.min(testCount, fakeOrders.length); i++) {
      (function(order, delay) {
        setTimeout(function() { showPopup(order); addRecent(order); }, 800 + delay * 600);
      })(fakeOrders[i], i);
    }
  }

  poll();
  setInterval(poll, 5000);
</script>
</body>
</html>
