[build]
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://cdn.omise.co; frame-src https://js.stripe.com; connect-src 'self' https://api.stripe.com; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;"

[[headers]]
  for = "/netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PATCH, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# Stripe 웹훅 raw body 유지
[functions]
  node_bundler = "esbuild"

# OFFICIAL VIP: refresh the existing season cache every 10 minutes (UTC).
# Registered here so Netlify schedules the existing refresh-vip-cache handler.
[functions."refresh-vip-cache"]
  schedule = "*/10 * * * *"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"
