<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --amber: #d4a843;
      --smoke: #f0ebe3;
      --smoke3: rgba(240,235,227,.28);
      --serif: 'Playfair Display', Georgia, serif;
      --body: 'DM Sans', system-ui, sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: transparent;
      font-family: var(--body);
      width:100vw; height:100vh;
      overflow:hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── TICKER BAR ── */
    .ticker-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 90px;
      background: rgba(4,4,4,0.2);
      border-top: 2px solid rgba(212,168,67,.6);
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    .ticker-pill {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 12px;
      padding: 0 32px 0 26px;
      height: 100%;
      background: rgba(212,168,67,.2);
      border-right: 1px solid rgba(212,168,67,.4);
      font-size: 1rem; letter-spacing: .22em; text-transform: uppercase;
      color: var(--amber); font-weight: 500;
      white-space: nowrap;
    }
    .ticker-pill .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 6px var(--amber);
      animation: blink 2s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    .ticker-scroll {
      flex: 1; overflow: hidden;
      position: relative; height: 100%;
      display: flex; align-items: center;
    }
    .ticker-track {
      display: flex; align-items: center;
      white-space: nowrap;
      animation: scroll 30s linear infinite;
    }
    @keyframes scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .ticker-item {
      display: inline-flex; align-items: center; gap: 14px;
      padding: 0 56px;
      font-size: 1.3rem; color: rgba(255,255,255,1); font-weight: 700; text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      letter-spacing: .03em;
    }
    .ticker-item .site {
      font-family: var(--serif); font-style: italic;
      color: var(--amber); font-size: 1.45rem;
    }
    .ticker-item .price {
      color: var(--smoke); font-weight: 500; font-size: 1.3rem;
    }
    .ticker-sep { color: rgba(212,168,67,.4); padding: 0 2px; }

    /* ── POPUP ── */
    #popup-wrap {
      position: fixed;
      bottom: 20px; left: 40px;
      display: flex; flex-direction: column; gap: 14px;
      z-index: 100;
    }
    .popup { animation: popIn .55s cubic-bezier(.175,.885,.32,1.275) both; }
    @keyframes popIn {
      from { opacity:0; transform: translateX(-20px) scale(.94); }
      to   { opacity:1; transform: translateX(0) scale(1); }
    }
    .popup.hide { animation: popOut .4s ease forwards; }
    @keyframes popOut {
      from { opacity:1; transform: translateX(0); }
      to   { opacity:0; transform: translateX(-14px); }
    }

    .receipt-box {
      background: rgba(15,13,10,.97);
      border: 2px solid var(--amber);
      padding: 22px 24px; width: 320px;
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 40px rgba(0,0,0,.8), 0 0 0 1px rgba(212,168,67,.1);
    }
    .receipt-site  { font-size:.7rem; letter-spacing:.12em; color:var(--smoke3); margin-bottom:5px; text-align:center; }
    .receipt-icon  { font-size:1.8rem; margin-bottom:6px; text-align:center; }
    .receipt-confirmed { font-size:.62rem; letter-spacing:.22em; color:var(--amber); text-transform:uppercase; margin-bottom:13px; text-align:center; }
    .receipt-line  { border:none; border-top:1px solid rgba(212,168,67,.18); margin:10px 0; }
    .receipt-row   { display:flex; justify-content:space-between; padding:4px 0; font-size:.9rem; }
    .receipt-label { color:var(--smoke3); }
    .receipt-value { color:var(--smoke); font-weight:500; max-width:180px; text-align:right; word-break:break-word; }
    .receipt-total-row { display:flex; justify-content:space-between; padding:7px 0; border-top:1px solid rgba(212,168,67,.25); margin-top:4px; }
    .receipt-total-label { color:var(--smoke); font-weight:600; font-size:.95rem; }
    .receipt-total-val   { color:var(--amber); font-weight:700; font-size:1.05rem; }


    /* ── TOP7 ZELDA ── */
    #top7-wrap {
      position: fixed;
      top: 90px; left: 50%;
      transform: translateX(-50%);
      width: 420px;
      z-index: 200;
      pointer-events: none;
      display: none;
    }
    #top7-box {
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 1.5px rgba(212,168,67,.55), 0 24px 70px rgba(0,0,0,.85);
      animation: t7In .6s cubic-bezier(.175,.885,.32,1.275) both;
      opacity: .95;
    }
    #top7-box.hide { animation: t7Out .4s ease forwards; }
    @keyframes t7In {
      from { opacity:0; transform: translateY(-20px) scale(.9); }
      to   { opacity:.95; transform: translateY(0) scale(1); }
    }
    @keyframes t7Out {
      from { opacity:.95; }
      to   { opacity:0; transform: translateY(-10px) scale(.95); }
    }
    .t7-scene {
      position: relative; height: 130px; overflow: hidden;
    }

    .t7-panel { background: rgba(4,2,10,.97); border-top: 1px solid rgba(212,168,67,.3); }

      padding: 6px 20px; text-align: center;
      background: rgba(212,168,67,.05); border-bottom: 1px solid rgba(212,168,67,.12);
      font-style: italic; font-size: .62rem; color: rgba(230,215,170,.6); letter-spacing: .07em;
      animation: ty 4s ease-in-out infinite;
    }
    @keyframes ty { 0%,100%{opacity:.6;} 50%{opacity:1;} }
    .t7-rows { padding: 8px 18px 6px; display: flex; flex-direction: column; gap: 3px; }
    .t7-r1 {
      display: flex; align-items: center; gap: 12px; padding: 9px 14px;
      background: linear-gradient(90deg, rgba(212,168,67,.2), rgba(212,168,67,.07), transparent);
      border-left: 3px solid #d4a843; margin-bottom: 3px;
    }
    .t7-r1 .t7n { font-size: 1.05rem; font-weight: 800; color: #f8edc0; flex: 1;
      text-shadow: 0 0 12px rgba(212,168,67,.4); letter-spacing: .02em; }
    .t7-r1 .t7s { font-size: .95rem; font-weight: 800; color: #d4a843; }
    .t7-row { display: flex; align-items: center; gap: 11px; padding: 5px 14px; }
    .t7-row.vis { background: rgba(255,255,255,.03); }
    .t7-row.ghost { opacity: .45; }
    .t7-badge {
      width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .66rem; font-weight: 700;
    }
    .t7b1 { background: radial-gradient(circle at 35% 30%, #ffe066, #d4a843 55%, #8a6010);
      color: #0a0500; box-shadow: 0 0 16px rgba(212,168,67,.9); }
    .t7b1lg { width: 30px; height: 30px; font-size: .76rem; }
    .t7b2 { background: linear-gradient(135deg,#e8e8e8,#b0b0b0); color: #111; }
    .t7b3 { background: linear-gradient(135deg,#d08050,#8a4010); color: #fff; }
    .t7bo { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: rgba(220,200,150,.5); }
    .t7n { flex: 1; font-size: .92rem; font-weight: 700; color: #e0d0a0; letter-spacing: .02em; }
    .t7-row.ghost .t7n { color: rgba(224,208,160,.9); }
    .t7s { font-size: .88rem; font-weight: 700; color: #b09040; }
    .t7-row.ghost .t7s { color: rgba(176,144,64,.9); }
    .t7-sep { height: 1px; background: linear-gradient(90deg,transparent,rgba(212,168,67,.2),transparent); margin: 3px 14px; }
    .t7-footer {
      border-top: 1px solid rgba(212,168,67,.12);
      padding: 6px 20px 8px; text-align: center;
      font-size: .48rem; color: rgba(220,200,140,.2); letter-spacing: .18em; text-transform: uppercase;
    }
    /* ── RECENT ── */
    #recent-wrap {
      position: fixed;
      top: 36px; right: 36px;
      width: 320px;
      display: flex; flex-direction: column; gap: 7px;
    }
    .recent-label { font-size:.75rem; letter-spacing:.22em; text-transform:uppercase; color:rgba(212,168,67,.6); margin-bottom:5px; text-align:right; }
    .recent-item {
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 16px;
      background:rgba(10,10,10,.88);
      border:1px solid rgba(212,168,67,.22);
      backdrop-filter:blur(10px);
      animation: fadeIn .35s ease both;
    }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .recent-name { font-size:.95rem; color:rgba(240,235,227,.75); }
    .recent-name span { color:var(--amber); }
    .recent-amt { font-size:.95rem; color:rgba(212,168,67,.85); font-weight:500; }
  </style>
</head>
<body>

<div id="popup-wrap"></div>
<div id="recent-wrap"></div>
<div id="top7-wrap"><div id="top7-box">
  <div class="t7-scene">
    <div class="t7-bg"></div>
    <div class="t7-bg-fade"></div>
    <div class="t7-header">
      <div class="t7-the">The Legend of</div>
      <div class="t7-title">SUPPORTERS</div>
      <div class="t7-wild">Breath of the Month</div>
    </div>
  </div>
  <div class="t7-panel">
    <div class="t7-thanks">" Thank you, brave adventurers — your kindness lights up this world "</div>
    <div class="t7-rows" id="t7-rows"></div>
    <div class="t7-footer">✦ &nbsp; pattayasoipearl.com &nbsp; ✦</div>
  </div>
</div></div>

<div class="ticker-bar">
  <div class="ticker-pill">
    <div class="dot"></div>
    Online Drinks
  </div>
  <div class="ticker-scroll">
    <div class="ticker-track" id="ticker-track"></div>
  </div>
</div>

<script>
  // ── TICKER MESSAGE (URL ?msg= 로 덮어쓰기 가능) ──
  var DEFAULT_MSG = '🌸 Support the Ladies · <span class="site">pattayasoipearl.com</span> · 🍹 <span class="price">฿210</span> per drink 🌸';

  function getMsg() {
    var params = new URLSearchParams(window.location.search);
    var custom = params.get('msg');
    if (custom) return '🌸 ' + custom + ' · <span class="site">pattayasoipearl.com</span> · 🍹 <span class="price">฿210</span> per drink 🌸';
    return DEFAULT_MSG;
  }

  // duplicate for seamless loop
  var track = document.getElementById('ticker-track');
  var msg = getMsg();
  var html = '';
  for (var i = 0; i < 6; i++) {
    html += '<span class="ticker-item">' + msg + '</span>';
  }
  track.innerHTML = html;

  // ── POPUP ──
  var recentOrders = [];
  var evtSource = null;
  var POPUP_DURATION = 30 * 1000; // 30초

  function showPopup(data) {
    var staffDisplay = (data.staff_name || '—') + (data.staff_no ? ' #' + data.staff_no : '');

    var popup = document.createElement('div');
    popup.className = 'popup';
    popup.innerHTML =
      '<div class="receipt-box">' +
        '<p class="receipt-site">pattayasoipearl.com</p>' +
        '<div class="receipt-icon">🌸</div>' +
        '<p class="receipt-confirmed">✦ Drink Confirmed ✦</p>' +
        '<hr class="receipt-line">' +
        '<div class="receipt-row"><span class="receipt-label">Bar</span><span class="receipt-value">' + (data.bar||'—') + '</span></div>' +
        '<div class="receipt-row"><span class="receipt-label">Staff</span><span class="receipt-value">' + staffDisplay + '</span></div>' +
        '<div class="receipt-row"><span class="receipt-label">From</span><span class="receipt-value">' + (data.from||'Anonymous') + '</span></div>' +
        (data.message ? '<div class="receipt-row"><span class="receipt-label">Message</span><span class="receipt-value">"' + data.message + '"</span></div>' : '') +
        '<hr class="receipt-line">' +
        '<div class="receipt-total-row"><span class="receipt-total-label">Drink Amount</span><span class="receipt-total-val">฿' + (data.tip_amount||0).toLocaleString() + '</span></div>' +
      '</div>';

    document.getElementById('popup-wrap').appendChild(popup);

    setTimeout(function() {
      popup.classList.add('hide');
      setTimeout(function() { popup.remove(); }, 500);
    }, POPUP_DURATION);
  }

  var MSG_DURATION = 90 * 1000; // 1분30초 // 3분

  function addRecent(data) {
    var staff = (data.staff_name||'Staff') + (data.staff_no ? ' #'+data.staff_no : '');
    var wrap = document.getElementById('recent-wrap');
    var item = document.createElement('div');
    item.className = 'recent-item';
    item.innerHTML =
      '<div class="recent-icon">🍹</div>' +
      '<div class="recent-body">' +
        '<div class="recent-name"><strong>' + (data.from||'Anonymous') + '</strong> sent a drink to <strong>' + staff + '</strong></div>' +
        '<div class="recent-amt">฿' + (data.tip_amount||0).toLocaleString() + ' · ' + (data.bar||'') + '</div>' +
      '</div>';
    wrap.appendChild(item);
    setTimeout(function() {
      item.classList.add('hide');
      setTimeout(function() { item.remove(); }, 400);
    }, MSG_DURATION);
  }

  var lastSeenId = null;
  var initialized = false;

  function poll() {
    fetch('/.netlify/functions/webhook')
      .then(function(r){ return r.json(); })
      .then(function(data) {
        var orders = data.orders || [];
        // 처음 켤 때는 기존 주문 무시하고 최신 ID만 저장
        if (!initialized) {
          initialized = true;
          if (orders.length > 0) lastSeenId = orders[0].id;
          return;
        }
        if (orders.length === 0) return;
        var newest = orders[0];
        if (newest.id !== lastSeenId) {
          var newOnes = [];
          for (var i = 0; i < orders.length; i++) {
            if (orders[i].id === lastSeenId) break;
            newOnes.push(orders[i]);
          }
          newOnes.reverse().forEach(function(o) {
            showPopup(o);
            addRecent(o);
          });
          fetchAndShowTop7();
          lastSeenId = newest.id;
        }
      })
      .catch(function(){});
  }


  var top7Timer = null;
  var TOP7_DURATION = 15 * 1000;
  function fetchAndShowTop7() {
    fetch('/.netlify/functions/webhook?month=1')
      .then(function(r){ return r.json(); })
      .then(function(data) {
        var orders = data.orders || [];
        if (orders.length > 0) fetchAndShowTop7();
      })
      .catch(function(){});
  }

  function showTop7(orders) {
    var counts = {};
    orders.forEach(function(o) {
      var name = o.from || 'Anonymous';
      var drinks = Math.round((o.tip_amount || 0) / 210);
      counts[name] = (counts[name] || 0) + drinks;
    });
    var sorted = Object.keys(counts).map(function(n){ return {name:n, drinks:counts[n]}; });
    sorted.sort(function(a,b){ return b.drinks - a.drinks; });
    var top7 = sorted.slice(0, 7);
    if (!top7.length) return;
    var rowsHtml = '';
    top7.forEach(function(p, i) {
      if (i === 0) {
        rowsHtml += '<div class="t7-r1"><div class="t7-badge t7b1 t7b1lg">I</div><div class="t7n">' + p.name + '</div><div class="t7s">🍹 ' + p.drinks + '</div></div>';
      } else {
        var bclass = i===1?'t7b2':i===2?'t7b3':'t7bo';
        var roman = ['','I','II','III','IV','V','VI','VII'][i+1];
        var cls = 't7-row' + (i < 5 ? ' vis' : ' ghost');
        if (i === 5) rowsHtml += '<div class="t7-sep"></div>';
        rowsHtml += '<div class="' + cls + '"><div class="t7-badge ' + bclass + '">' + roman + '</div><div class="t7n">' + p.name + '</div><div class="t7s">🍹 ' + p.drinks + '</div></div>';
      }
    });
    document.getElementById('t7-rows').innerHTML = rowsHtml;
    var wrap = document.getElementById('top7-wrap');
    var box = document.getElementById('top7-box');
    box.classList.remove('hide');
    wrap.style.display = 'block';
    if (top7Timer) clearTimeout(top7Timer);
    top7Timer = setTimeout(function() {
      box.classList.add('hide');
      setTimeout(function() { wrap.style.display = 'none'; }, 450);
    }, TOP7_DURATION);
  }
  function connect() {
    poll();
    setInterval(poll, 5000);
  }

  // TEST: overlay.html?test=N (N개 팝업)
  var testParam = new URLSearchParams(window.location.search).get('test');
  if (testParam) {
    var testCount = parseInt(testParam) || 1;
    var fakeOrders = [
      { from:'Julien', staff_name:'Fah',  staff_no:'60', bar:'Nikki Bar',    tip_amount:4410, message:'You are amazing!' },
      { from:'John',   staff_name:'Jai',  staff_no:'12', bar:'Nikki Bar',    tip_amount:3150, message:'See you tonight!' },
      { from:'Mike',   staff_name:'Su',   staff_no:'7',  bar:'Nikki Bar',    tip_amount:2100, message:'' },
      { from:'David',  staff_name:'Nook', staff_no:'33', bar:'Nikki Bar',    tip_amount:1680, message:'Miss you!' },
      { from:'Chris',  staff_name:'Bow',  staff_no:'5',  bar:'Nikki Bar',    tip_amount:1260, message:'For the best girl!' },
      { from:'Tom',    staff_name:'Mint', staff_no:'9',  bar:'Nikki Bar',    tip_amount:840,  message:'' },
      { from:'Alex',   staff_name:'Noi',  staff_no:'14', bar:'Nikki Bar',    tip_amount:420,  message:'Cheers!' },
    ];
    for (var i = 0; i < Math.min(testCount, fakeOrders.length); i++) {
      (function(order, delay) {
        setTimeout(function() {
          showPopup(order); addRecent(order);
          showTop7(fakeOrders);
        }, 800 + delay * 600);
      })(fakeOrders[i], i);
    }
  }

  connect();
</script>
</body>
</html>
